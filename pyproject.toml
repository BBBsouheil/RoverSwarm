[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roverswarm"
version = "1.0.0"
description = "Simulation reproductible d'exploration autonome par un essaim de rovers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "gymnasium==1.3.0",
  "numpy==2.5.3",
  "pettingzoo==1.27.0",
  "pygame-ce==2.5.8",
  "stable-baselines3==2.9.0",
  "sb3-contrib==2.9.0",
  "torch==2.14.0",
  "matplotlib==3.11.2",
]
keywords = ["reinforcement-learning", "robotics", "multi-agent", "ppo", "simulation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
roverswarm-train = "roverswarm.train:main"
roverswarm-evaluate = "roverswarm.evaluate:main"
roverswarm-demo = "roverswarm.visualize:main"
roverswarm-mission = "roverswarm.mission_control:main"
roverswarm-play = "roverswarm.mission_control:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
